<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Carousel</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <style>
        #home-slide .carousel-indicators li {
            background-color: palevioletred;
        }
    </style>
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <h1 class="text-center">Bootstrap Carousel</h1>

                <!-- <div id="home-slide" class="carousel slide carousel-fade" data-ride="carousel"> -->
                <div id="home-slide" class="carousel slide carousel" data-ride="carousel">
                    <div class="carousel-inner">
                        <div class="carousel-item active" data-interval="3000">
                            <img src="images/slide-1.png" alt="" class="d-block w-100">
                            <div class="carousel-caption">
                                <h5>Caption 1</h5>
                                <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
                            </div>
                        </div>
                        <div class="carousel-item">
                            <img src="images/slide-2.png" alt="" class="d-block w-100">
                        </div>
                        <div class="carousel-item">
                            <img src="images/slide-3.png" alt="" class="d-block w-100">
                        </div>
                        <div class="carousel-item" data-interval="3000">
                            <img src="images/slide-4.png" alt="" class="d-block w-100">
                        </div>
                    </div>

                    <a href="#home-slide" class="carousel-control-prev" data-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </a>
                    <a href="#home-slide" class="carousel-control-next" data-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </a>

                    <ol class="carousel-indicators">
                        <li data-target="#home-slide" class="active" data-slide-to="0"></li>
                        <li data-target="#home-slide" data-slide-to="1"></li>
                        <li data-target="#home-slide" data-slide-to="2"></li>
                        <li data-target="#home-slide" data-slide-to="3"></li>
                    </ol>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#home-slide').carousel({
                interval: 2000,
                ride: 'carousel',

            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
